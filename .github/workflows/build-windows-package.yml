name: release Windows Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to publish (for example v7.25.6), or blank to build only'
        required: false
        type: string
      compression_trial:
        description: 'Build and test the WPF LZMA2 installer archive without publishing a Release'
        type: boolean
        default: false
  push:
    branches:
      - master

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: build Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Purge SDKs
        shell: pwsh
        run: |
          echo "Before:"
          dotnet --list-sdks

          dotnet --list-sdks | % {
            $_ -match '^\S+\s+\[(.+)\]$' > $null
            $d = Join-Path $Matches[1] $_.Split()[0]
            Write-Host "Removing $d"
            if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
          }

          echo "After:"
          dotnet --list-sdks 2>$null; $LASTEXITCODE=0

      - name: Setup .NET 10.0.1xx
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx

      - name: Build and package Windows x64 installers
        id: installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMPRESSION_TRIAL: ${{ inputs.compression_trial }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $options = @{
            Arch = 'x64'
            Flavor = 'all'
          }
          $region = $env:GITHUB_REF_NAME
          $regional = $region -in @('tw', 'cn')
          if ($env:COMPRESSION_TRIAL -eq 'true') {
            if ($env:RELEASE_TAG) {
              throw 'Leave release_tag blank for the compression trial.'
            }
            if ($region -match '^codex/(tw|cn)-') {
              $region = $Matches[1]
              $regional = $true
            }
            if (-not $regional) {
              throw 'Run the compression trial on tw, cn, or a matching codex/tw-* or codex/cn-* branch.'
            }
            $options.StoreInstallerPayload = $true
            $options.Flavor = 'wpf'
          }
          if ($env:RELEASE_TAG) {
            $version = $env:RELEASE_TAG -replace '^v', ''
            if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'release_tag must be a numeric version tag (for example v7.25.6).'
            }
            $options.Version = $version
          }
          if ($regional) {
            $sourceVersion = ([xml](Get-Content -Raw v2rayN/Directory.Build.props)).Project.PropertyGroup.Version |
              Where-Object { $_ }
            if ($sourceVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'Invalid version in Directory.Build.props.'
            }
            if ($env:RELEASE_TAG -and $version -ne $sourceVersion) {
              throw "Expected release_tag v$sourceVersion for the version being built."
            }
            $options.Version = $sourceVersion
            $options.CabinetCompression = 'high'
            "package_base=v2rayN_v${sourceVersion}_x64_zh${region}" >> $env:GITHUB_OUTPUT
          }
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'package-windows.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw "Packaging script not found: $scriptPath"
          }
          & $scriptPath @options
          if (-not $?) { throw 'v2rayN installer packaging failed.' }

      - name: Verify and archive Windows x64 installers
        shell: pwsh
        env:
          PACKAGE_BASE: ${{ steps.installer.outputs.package_base }}
          COMPRESSION_TRIAL: ${{ inputs.compression_trial }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location dist
          $installers = [ordered]@{
            'v2rayN-windows-64.exe' = $env:PACKAGE_BASE
          }
          if ($env:COMPRESSION_TRIAL -ne 'true') {
            $installers['v2rayN-windows-64-desktop.exe'] = "${env:PACKAGE_BASE}_desktop"
          }
          $built = @(Get-ChildItem -File -Filter 'v2rayN-windows-*.exe')
          if ($built.Count -ne $installers.Count) {
            throw "Expected $($installers.Count) installers, found $($built.Count)."
          }
          if ($env:PACKAGE_BASE) {
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
            if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
              $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
            }
          }
          foreach ($name in $installers.Keys) {
            $installer = Get-Item -LiteralPath $name
            if ($installer.Length -le 0) {
              throw "Empty installer: $name"
            }
            if ($env:PACKAGE_BASE) {
              $baseName = $installers[$name]
              $setupName = "${baseName}_setup.exe"
              $archiveName = "$baseName.7z"
              Rename-Item -LiteralPath $name -NewName $setupName
              $compression = @('-m0=LZMA2:d=64m:fb=64')
              if ($env:COMPRESSION_TRIAL -eq 'true') {
                $compression = @('-m0=LZMA2:d=128m:fb=273', '-mf=off')
              }
              & $sevenZip a -t7z -mx=9 @compression -mmt=2 $archiveName $setupName
              if ($LASTEXITCODE -ne 0) { throw "7-Zip could not create $archiveName." }
              & $sevenZip t $archiveName
              if ($LASTEXITCODE -ne 0) { throw "7-Zip integrity check failed for $archiveName." }
              $archiveBytes = (Get-Item -LiteralPath $archiveName).Length
              $installer = Get-Item -LiteralPath $setupName
              "$archiveName — $archiveBytes bytes (setup.exe: $($installer.Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
            }
            Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256 | Format-List
          }

      - name: Upload Windows x64 installers
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-installers
          path: |
            ${{ !inputs.compression_trial && 'dist/v2rayN*.exe' || '' }}
            dist/v2rayN*.7z
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Test extracted WPF installer
        if: inputs.compression_trial
        shell: pwsh
        env:
          PACKAGE_BASE: ${{ steps.installer.outputs.package_base }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          }
          $extracted = Join-Path $env:RUNNER_TEMP 'v2rayN-installer-smoke'
          $setupName = "${env:PACKAGE_BASE}_setup.exe"
          & $sevenZip x "-o$extracted" "dist/$env:PACKAGE_BASE.7z"
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract WPF installer.' }
          $setup = Join-Path $extracted $setupName
          $originalHash = (Get-FileHash -LiteralPath "dist/$setupName").Hash
          if ((Get-FileHash -LiteralPath $setup).Hash -ne $originalHash) {
            throw 'Extracted installer does not match the built EXE.'
          }
          $installDir = Join-Path $env:ProgramFiles 'v2rayN'
          $app = Join-Path $installDir 'v2rayN.exe'
          $install = Start-Process -FilePath $setup -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Install failed: $($install.ExitCode)" }
          try {
            foreach ($relativePath in @('v2rayN.exe', 'bin/xray/xray.exe', 'bin/sing_box/sing-box.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $installDir $relativePath) -PathType Leaf)) {
                throw "Missing installed file: $relativePath"
              }
            }
          } finally {
            $uninstall = Start-Process -FilePath $setup -ArgumentList '/uninstall', '/quiet', '/norestart' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $app)) {
              throw "Uninstall failed: $($uninstall.ExitCode)"
            }
          }

  release:
    name: sign and upload Windows x64 installers
    if: inputs.release_tag != '' && !inputs.compression_trial
    needs: build
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      desktop_release: true
      artifact_name: release-windows-installers
      file_pattern: 'v2rayN*[ez]'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

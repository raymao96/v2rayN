name: release Windows Package

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      compression_trial:
        required: false
        type: boolean
        default: false
      maintenance_baseline_run:
        required: false
        type: string
      tag_managed_by_caller:
        required: false
        type: boolean
        default: false
    secrets:
      GPG_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to publish (for example v7.25.6), or blank to build only'
        required: false
        type: string
      compression_trial:
        description: 'Build and test the WPF LZMA2 installer archive without publishing a Release'
        type: boolean
        default: false
      maintenance_baseline_run:
        description: 'Optional Actions run ID containing the previous WPF trial archive'
        type: string
      upgrade_baseline_tag:
        description: 'Optional published release tag (for example tw-v7.25.6) to verify WPF and Avalonia overwrite upgrades'
        type: string
  push:
    branches:
      - master

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ inputs.tag_managed_by_caller && format('release-windows-nested-{0}', github.run_id) || format('release-windows-{0}', github.ref_name) }}
  queue: max

jobs:
  build:
    name: build Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Purge SDKs
        shell: pwsh
        run: |
          echo "Before:"
          dotnet --list-sdks

          dotnet --list-sdks | % {
            $_ -match '^\S+\s+\[(.+)\]$' > $null
            $d = Join-Path $Matches[1] $_.Split()[0]
            Write-Host "Removing $d"
            if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
          }

          echo "After:"
          dotnet --list-sdks 2>$null; $LASTEXITCODE=0

      - name: Setup .NET 10.0.1xx
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx

      - name: Build and package Windows x64 installers
        id: installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMPRESSION_TRIAL: ${{ inputs.compression_trial }}
          UPGRADE_BASELINE_TAG: ${{ inputs.upgrade_baseline_tag }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $options = @{
            Arch = 'x64'
            Flavor = 'all'
          }
          $region = $env:GITHUB_REF_NAME
          $regional = $region -in @('tw', 'cn')
          if ($env:COMPRESSION_TRIAL -eq 'true') {
            if ($env:RELEASE_TAG) {
              throw 'Leave release_tag blank for the compression trial.'
            }
            if ($region -match '^codex/(tw|cn)-') {
              $region = $Matches[1]
              $regional = $true
            }
            if (-not $regional) {
              throw 'Run the compression trial on tw, cn, or a matching codex/tw-* or codex/cn-* branch.'
            }
            if (-not $env:UPGRADE_BASELINE_TAG) {
              $options.Flavor = 'wpf'
            }
          }
          if ($env:RELEASE_TAG) {
            $version = $env:RELEASE_TAG -replace '^v', ''
            if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'release_tag must be a numeric version tag (for example v7.25.6).'
            }
            $options.Version = $version
          }
          if ($regional) {
            $sourceVersion = ([xml](Get-Content -Raw v2rayN/Directory.Build.props)).Project.PropertyGroup.Version |
              Where-Object { $_ }
            if ($sourceVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'Invalid version in Directory.Build.props.'
            }
            if ($env:RELEASE_TAG -and $version -ne $sourceVersion) {
              throw "Expected release_tag v$sourceVersion for the version being built."
            }
            $buildVersion = $sourceVersion
            if ($env:COMPRESSION_TRIAL -eq 'true' -and $env:UPGRADE_BASELINE_TAG) {
              $parts = $sourceVersion.Split('.')
              $buildVersion = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
            }
            $options.Version = $buildVersion
            $options.StoreInstallerPayload = $true
            $options.InstallerCulture = @{ tw = 'zh-TW'; cn = 'zh-CN' }[$region]
            "package_base=v2rayN_v${buildVersion}_x64_zh${region}" >> $env:GITHUB_OUTPUT
            "region=$region" >> $env:GITHUB_OUTPUT
          }
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'package-windows.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw "Packaging script not found: $scriptPath"
          }
          & $scriptPath @options
          if (-not $?) { throw 'v2rayN installer packaging failed.' }

      - name: Verify and archive Windows x64 installers
        shell: pwsh
        env:
          PACKAGE_BASE: ${{ steps.installer.outputs.package_base }}
          COMPRESSION_TRIAL: ${{ inputs.compression_trial }}
          UPGRADE_BASELINE_TAG: ${{ inputs.upgrade_baseline_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location dist
          $installers = [ordered]@{
            'v2rayN-windows-64.exe' = $env:PACKAGE_BASE
          }
          if ($env:COMPRESSION_TRIAL -ne 'true' -or $env:UPGRADE_BASELINE_TAG) {
            $installers['v2rayN-windows-64-desktop.exe'] = "${env:PACKAGE_BASE}_desktop"
          }
          $built = @(Get-ChildItem -File -Filter 'v2rayN-windows-*.exe')
          if ($built.Count -ne $installers.Count) {
            throw "Expected $($installers.Count) installers, found $($built.Count)."
          }
          if ($env:PACKAGE_BASE) {
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
            if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
              $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
            }
          }
          foreach ($name in $installers.Keys) {
            $installer = Get-Item -LiteralPath $name
            if ($installer.Length -le 0) {
              throw "Empty installer: $name"
            }
            if ($env:PACKAGE_BASE) {
              $baseName = $installers[$name]
              $setupName = "${baseName}_setup.exe"
              $archiveName = "$baseName.7z"
              Rename-Item -LiteralPath $name -NewName $setupName
              $compression = @('-m0=LZMA2:d=128m:fb=273', '-mf=off')
              & $sevenZip a -t7z -mx=9 @compression -mmt=2 $archiveName $setupName
              if ($LASTEXITCODE -ne 0) { throw "7-Zip could not create $archiveName." }
              & $sevenZip t $archiveName
              if ($LASTEXITCODE -ne 0) { throw "7-Zip integrity check failed for $archiveName." }
              $archiveBytes = (Get-Item -LiteralPath $archiveName).Length
              $installer = Get-Item -LiteralPath $setupName
              "$archiveName — $archiveBytes bytes (setup.exe: $($installer.Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
            }
            Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256 | Format-List
          }

      - name: Upload Windows x64 installers
        if: '!inputs.compression_trial'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-installers
          path: |
            dist/v2rayN*.exe
            dist/v2rayN*.7z
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Upload WPF trial archive directly
        if: inputs.compression_trial
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.installer.outputs.package_base }}.7z
          archive: false
          if-no-files-found: error

      - name: Test extracted WPF installer
        if: inputs.compression_trial
        shell: pwsh
        env:
          PACKAGE_BASE: ${{ steps.installer.outputs.package_base }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          }
          $extracted = Join-Path $env:RUNNER_TEMP 'v2rayN-installer-smoke'
          $setupName = "${env:PACKAGE_BASE}_setup.exe"
          & $sevenZip x "-o$extracted" "dist/$env:PACKAGE_BASE.7z"
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract WPF installer.' }
          $setup = Join-Path $extracted $setupName
          $originalHash = (Get-FileHash -LiteralPath "dist/$setupName").Hash
          if ((Get-FileHash -LiteralPath $setup).Hash -ne $originalHash) {
            throw 'Extracted installer does not match the built EXE.'
          }
          $installDir = Join-Path $env:ProgramFiles 'v2rayN'
          $app = Join-Path $installDir 'v2rayN.exe'
          $install = Start-Process -FilePath $setup -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Install failed: $($install.ExitCode)" }
          try {
            foreach ($relativePath in @('v2rayN.exe', 'bin/xray/xray.exe', 'bin/sing_box/sing-box.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $installDir $relativePath) -PathType Leaf)) {
                throw "Missing installed file: $relativePath"
              }
            }
          } finally {
            $uninstall = Start-Process -FilePath $setup -ArgumentList '/uninstall', '/quiet', '/norestart' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $app)) {
              throw "Uninstall failed: $($uninstall.ExitCode)"
            }
          }

      - name: Download previous WPF trial archive
        if: inputs.compression_trial && inputs.maintenance_baseline_run != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.maintenance_baseline_run }}
          pattern: 'v2rayN_*_x64_zh??.7z'
          merge-multiple: true
          path: ${{ runner.temp }}/v2rayN-maintenance-baseline

      - name: Test maintenance with a previous WPF bundle
        if: inputs.compression_trial && inputs.maintenance_baseline_run != ''
        shell: pwsh
        env:
          PACKAGE_BASE: ${{ steps.installer.outputs.package_base }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP 'v2rayN-maintenance-baseline'
          $archive = @(Get-ChildItem -LiteralPath $baseline -Filter '*.7z' -File)
          if ($archive.Count -ne 1) { throw 'Expected exactly one previous WPF trial archive.' }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          }
          & $sevenZip x "-o$baseline" $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the previous WPF installer.' }
          $previous = @(Get-ChildItem -LiteralPath $baseline -Filter '*_setup.exe' -File)
          if ($previous.Count -ne 1) { throw 'Expected exactly one previous WPF installer.' }
          $current = Join-Path $env:RUNNER_TEMP "v2rayN-installer-smoke/${env:PACKAGE_BASE}_setup.exe"
          & ./installer/maintenance/Test-Maintenance.ps1 -PreviousSetup $previous[0].FullName -CurrentSetup $current

      - name: Test overwrite upgrade with published release
        if: inputs.compression_trial && inputs.upgrade_baseline_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_BASE: ${{ steps.installer.outputs.package_base }}
          REGION: ${{ steps.installer.outputs.region }}
          UPGRADE_BASELINE_TAG: ${{ inputs.upgrade_baseline_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          }
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'v2rayN-upgrade-baseline'
          $currentRoot = Join-Path $env:RUNNER_TEMP 'v2rayN-upgrade-current'
          New-Item -ItemType Directory -Force -Path $baselineRoot, $currentRoot | Out-Null
          gh release download $env:UPGRADE_BASELINE_TAG --repo $env:GITHUB_REPOSITORY --pattern "v2rayN_*_x64_zh${env:REGION}*.7z" --dir $baselineRoot
          if ($LASTEXITCODE -ne 0) { throw "Failed to download baseline archives from $env:UPGRADE_BASELINE_TAG." }
          foreach ($flavor in @('wpf', 'desktop')) {
            $suffix = if ($flavor -eq 'desktop') { '_desktop' } else { '' }
            $baselineArchive = @(Get-ChildItem -LiteralPath $baselineRoot -Filter "v2rayN_*_x64_zh${env:REGION}${suffix}.7z" -File)
            if ($baselineArchive.Count -ne 1) { throw "Expected one published $flavor archive in $env:UPGRADE_BASELINE_TAG." }
            $prevDir = Join-Path $baselineRoot $flavor
            $currDir = Join-Path $currentRoot $flavor
            & $sevenZip x "-o$prevDir" $baselineArchive[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not extract published $flavor archive." }
            & $sevenZip x "-o$currDir" "dist/${env:PACKAGE_BASE}${suffix}.7z"
            if ($LASTEXITCODE -ne 0) { throw "Could not extract candidate $flavor archive." }
            $prevSetup = @(Get-ChildItem -LiteralPath $prevDir -Filter '*_setup.exe' -File)
            $currSetup = @(Get-ChildItem -LiteralPath $currDir -Filter '*_setup.exe' -File)
            if ($prevSetup.Count -ne 1 -or $currSetup.Count -ne 1) { throw "Missing extracted $flavor setup executable." }
            & ./installer/maintenance/Test-Maintenance.ps1 -PreviousSetup $prevSetup[0].FullName -CurrentSetup $currSetup[0].FullName -Flavor $flavor -VerifyUpgrade
          }

      - name: Save upgrade test logs
        if: failure() && inputs.compression_trial && inputs.upgrade_baseline_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-test-logs
          path: ${{ runner.temp }}/v2rayN-*-upgrade*.log
          if-no-files-found: ignore

  release:
    name: sign and upload Windows x64 installers
    if: inputs.release_tag != '' && !inputs.compression_trial
    needs: build
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      desktop_release: true
      artifact_name: release-windows-installers
      file_pattern: 'v2rayN*[ez]'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  update-release-tag:
    if: inputs.release_tag != '' && !inputs.compression_trial && !inputs.tag_managed_by_caller && (github.ref_name == 'tw' || github.ref_name == 'cn')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Update regional release tag
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.release_tag }}
        run: bash .github/scripts/update-release-tag.sh "${GITHUB_REF_NAME}-v${VERSION_INPUT#v}" "$GITHUB_SHA"

      - name: Promote completed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_INPUT: ${{ inputs.release_tag }}
        run: gh release edit --prerelease=false -- "${GITHUB_REF_NAME}-v${VERSION_INPUT#v}"

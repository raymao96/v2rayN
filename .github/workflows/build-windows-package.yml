name: release Windows Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version check for the existing regional Release (for example v7.25.6)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: build Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 360
    outputs:
      version: ${{ steps.installer.outputs.version }}
      release_tag: ${{ steps.installer.outputs.release_tag }}
      release_title: ${{ steps.installer.outputs.release_title }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Purge SDKs
        shell: pwsh
        run: |
          echo "Before:"
          dotnet --list-sdks

          dotnet --list-sdks | % {
            $_ -match '^\S+\s+\[(.+)\]$' > $null
            $d = Join-Path $Matches[1] $_.Split()[0]
            Write-Host "Removing $d"
            if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
          }

          echo "After:"
          dotnet --list-sdks 2>$null; $LASTEXITCODE=0

      - name: Setup .NET 10.0.1xx
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx

      - name: Build and package Windows x64 WPF installer
        id: installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = $env:GITHUB_REF_NAME
          if ($ref -notmatch '^(?:codex/)?(tw|cn)(?:$|-)') {
            throw "Expected a TW or CN build ref, got $ref."
          }
          $edition = $Matches[1]
          $culture = @{ tw = 'zh-TW'; cn = 'zh-CN' }[$edition]
          $version = ([xml](Get-Content -Raw v2rayN/Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Invalid application version in Directory.Build.props.'
          }
          $releaseTag = "$edition-v$version"
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -notin @($releaseTag, "v$version", $version)) {
            throw "Expected Release $releaseTag for application version $version."
          }
          $options = @{
            Arch = 'x64'
            Flavor = 'wpf'
            Version = $version
            InstallerCulture = $culture
          }
          "path=dist/v2rayN-windows-64-v$version.exe" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_title=$($edition.ToUpperInvariant()) v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building $culture v$version from $(git rev-parse HEAD)"
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'package-windows.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            throw "Packaging script not found: $scriptPath"
          }
          & $scriptPath @options
          if (-not $?) { throw 'v2rayN installer packaging failed.' }

      - name: Verify Windows x64 WPF installer
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
          INSTALLER_VERSION: ${{ steps.installer.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Item -LiteralPath $env:INSTALLER_PATH
          if ($installer.Length -le 0 -or $installer.VersionInfo.ProductVersion -ne $env:INSTALLER_VERSION) {
            throw "Unexpected product version or empty installer: $($installer.FullName)"
          }
          Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256 | Format-List

      - name: Upload Windows x64 installers
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-installers
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: sign and upload Windows x64 WPF installer
    needs: build
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ needs.build.outputs.release_tag }}
      existing_release_title: ${{ needs.build.outputs.release_title }}
      artifact_name: release-windows-installers
      file_pattern: "v2rayN-windows-64-v${{ needs.build.outputs.version }}.exe"
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

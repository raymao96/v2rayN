name: build

on:
  workflow_call:
    inputs:
      project:
        required: false
        type: string
        default: './v2rayN.Desktop/v2rayN.Desktop.csproj'
      isAot:
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: build Windows x64
    runs-on: windows-latest
    env:
      RID: win-x64
      Project: ${{ inputs.project }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Purge SDKs
      shell: pwsh
      run: |
        echo "Before:"
        dotnet --list-sdks
        
        dotnet --list-sdks | % {
          $_ -match '^\S+\s+\[(.+)\]$' > $null
          $d = Join-Path $Matches[1] $_.Split()[0]
          Write-Host "Removing $d"
          rm $d -r -fo
        }
        
        echo "After:"
        dotnet --list-sdks 2>$null; $LASTEXITCODE=0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Set AOT Environment Variable
      shell: bash
      run: |
        if [ "${{ inputs.isAot }}" = "true" ]; then
          echo "DOTNET_AOT_ARG=-p:IsAot=true" >> $GITHUB_ENV
        else
          echo "DOTNET_AOT_ARG=-p:IsAot=false" >> $GITHUB_ENV
        fi

    - name: Set OUTPUT Environment Variable
      shell: bash
      run: |
        RAW_PATH="${{ github.workspace }}/x64${{ inputs.isAot && '-aot' || '' }}"
        echo "OUTPUT=${RAW_PATH//\\//}" >> "$GITHUB_ENV"

    - name: Build AmazTool
      shell: bash
      working-directory: ./v2rayN
      run: dotnet publish ./AmazTool/AmazTool.csproj -c Release -r $RID -p:SelfContained=true -p:PublishTrimmed=true -p:EnableWindowsTargeting=true ${{ env.DOTNET_AOT_ARG }} -o ${{ env.OUTPUT }}

    - name: Build v2rayN WPF
      shell: bash
      if: inputs.project == './v2rayN/v2rayN.csproj'
      working-directory: ./v2rayN
      run: dotnet publish $Project -c Release -r $RID -p:SelfContained=true -p:EnableWindowsTargeting=true -o ${{ env.OUTPUT }}

    - name: Build v2rayN Avalonia
      shell: bash
      if: inputs.project == './v2rayN.Desktop/v2rayN.Desktop.csproj'
      working-directory: ./v2rayN
      run: dotnet publish $Project -c Release -r $RID -p:SelfContained=true -p:EnableWindowsTargeting=true ${{ env.DOTNET_AOT_ARG }} -o ${{ env.OUTPUT }}

    - name: Remove Debug Symbols
      shell: bash
      run: |
        find ${{ env.OUTPUT }} -type f -name '*.pdb' -delete
        find ${{ env.OUTPUT }} -type f -name '*.debug' -delete
        find ${{ env.OUTPUT }} -type f -name '*.dbg' -delete
        find ${{ env.OUTPUT }} -type f -name '*.sym' -delete
        find ${{ env.OUTPUT }} -name '*.dSYM' -exec rm -rf {} +

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: x64${{ inputs.isAot && '-aot' || '' }}
        path: ${{ env.OUTPUT }}

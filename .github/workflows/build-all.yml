name: release Windows x64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-windows-${{ github.ref_name }}
  queue: max

jobs:
  public-key:
    if: inputs.release_tag != ''
    uses: ./.github/workflows/pub-key.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  wpf:
    needs: public-key
    uses: ./.github/workflows/build-windows.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  desktop:
    needs: wpf
    uses: ./.github/workflows/build-windows-desktop.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  installers:
    needs: desktop
    uses: ./.github/workflows/build-windows-package.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      tag_managed_by_caller: true
    secrets: inherit

  publish:
    needs: [public-key, wpf, desktop, installers]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Update regional release tag
        if: github.ref_name == 'tw' || github.ref_name == 'cn'
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.release_tag }}
        run: bash .github/scripts/update-release-tag.sh "${GITHUB_REF_NAME}-v${VERSION_INPUT#v}" "$GITHUB_SHA"

      - name: Promote completed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$VERSION_INPUT"
          if [[ "$GITHUB_REF_NAME" == tw || "$GITHUB_REF_NAME" == cn ]]; then
            tag="${GITHUB_REF_NAME}-v${VERSION_INPUT#v}"
          fi
          gh release edit --prerelease=false -- "$tag"

name: publish GPG public key

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
    - name: Resolve release identity
      id: release
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.release_tag }}
        REGIONAL_RELEASE: ${{ (github.ref_name == 'tw' || github.ref_name == 'cn') }}
      run: |
        tag="$VERSION_INPUT"
        title="$tag"
        if [[ "$REGIONAL_RELEASE" == true ]]; then
          version="v${VERSION_INPUT#v}"
          tag="${GITHUB_REF_NAME}-$version"
          region="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:lower:]' '[:upper:]')"
          title="$region $version"
          echo "target_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "title=$title" >> "$GITHUB_OUTPUT"

    - name: Import GPG private key
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        install -m 700 -d ~/.gnupg
        printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

    - name: Export GPG public key
      shell: bash
      run: |
        set -euo pipefail
        fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
        [[ -n "$fingerprint" ]] || { echo "No GPG secret key found."; exit 1; }
        gpg --batch --armor --export "$fingerprint" > v2rayN-public-key.asc

    - name: Upload GPG public key to release
      uses: svenstaro/upload-release-action@v2
      with:
        file: v2rayN-public-key.asc
        tag: ${{ steps.release.outputs.tag }}
        release_name: ${{ steps.release.outputs.title }}
        target_commit: ${{ steps.release.outputs.target_commit }}
        prerelease: true
        overwrite: true

name: sign and upload release files

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      desktop_release:
        required: false
        type: boolean
        default: false
      existing_release_title:
        required: false
        type: string
      artifact_name:
        required: true
        type: string
      file_pattern:
        required: false
        type: string
        default: '**/*'
      content_type:
        required: false
        type: string
        default: application/octet-stream
    secrets:
      GPG_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-26.04
    steps:
    - name: Resolve release identity
      id: release
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.release_tag }}
        REGIONAL_RELEASE: ${{ inputs.desktop_release && (github.ref_name == 'tw' || github.ref_name == 'cn') }}
      run: |
        tag="$VERSION_INPUT"
        title="$tag"
        if [[ "$REGIONAL_RELEASE" == true ]]; then
          version="v${VERSION_INPUT#v}"
          tag="${GITHUB_REF_NAME}-$version"
          region="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:lower:]' '[:upper:]')"
          title="$region $version"
          echo "target_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "title=$title" >> "$GITHUB_OUTPUT"

    - name: Confirm existing Release identity
      if: inputs.existing_release_title != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
        EXPECTED_TITLE: ${{ inputs.existing_release_title }}
      run: |
        set -euo pipefail
        release=$(gh release view "$RELEASE_TAG" --json name,isDraft)
        jq -e --arg title "$EXPECTED_TITLE" '.name == $title and (.isDraft | not)' <<<"$release"

    - name: Download release artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_name }}
        path: dist

    - name: Import GPG private key
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        install -m 700 -d ~/.gnupg
        printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

    - name: Sign release files
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        shopt -s globstar nullglob
        files=( ${{ inputs.file_pattern }} )
        (( ${#files[@]} )) || { echo "No files matched: ${{ inputs.file_pattern }}"; exit 1; }
        for f in "${files[@]}"; do
          [[ -f "$f" ]] || continue
          gpg --batch --yes --armor --detach-sign --output "$f.sig" "$f"
        done

    - name: Append signed installer to the existing Release
      if: inputs.existing_release_title != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
        INSTALLER: ${{ inputs.file_pattern }}
      run: |
        set -euo pipefail
        cd dist
        assets=$(gh release view "$RELEASE_TAG" --json assets)
        previous=$(mktemp -d)
        pending=()
        for file in "$INSTALLER" "$INSTALLER.sig"; do
          if jq -e --arg name "$file" '.assets | any(.name == $name)' <<<"$assets" >/dev/null; then
            gh release download "$RELEASE_TAG" --pattern "$file" --dir "$previous"
            if [[ "$file" == "$INSTALLER.sig" ]]; then
              gpg --batch --verify "$previous/$file" "$INSTALLER"
            else
              cmp "$previous/$file" "$INSTALLER"
            fi
          else
            pending+=("$file")
          fi
        done
        if (( ${#pending[@]} )); then
          gh release upload "$RELEASE_TAG" "${pending[@]}"
        fi

    - name: Upload release files
      if: inputs.existing_release_title == ''
      uses: svenstaro/upload-release-action@v2
      with:
        file: dist/${{ inputs.file_pattern }}
        tag: ${{ steps.release.outputs.tag }}
        release_name: ${{ steps.release.outputs.title }}
        target_commit: ${{ steps.release.outputs.target_commit }}
        file_glob: true
        prerelease: true
        overwrite: true

    - name: Upload release signatures
      if: inputs.existing_release_title == ''
      uses: svenstaro/upload-release-action@v2
      with:
        file: dist/${{ inputs.file_pattern }}.sig
        tag: ${{ steps.release.outputs.tag }}
        release_name: ${{ steps.release.outputs.title }}
        target_commit: ${{ steps.release.outputs.target_commit }}
        file_glob: true
        prerelease: true
        overwrite: true

    - name: Promote Windows release
      if: inputs.desktop_release && inputs.existing_release_title == ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
      run: gh release edit --prerelease=false -- "$RELEASE_TAG"
